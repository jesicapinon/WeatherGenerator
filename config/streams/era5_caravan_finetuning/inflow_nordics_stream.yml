  base_datetime : '1951-01-01T00:00:00'
  coords_channels : ['lat', 'lon']
  target:
    - 'obsvalue_streamflow_0'
  geoinfo_channels:
    - 'area'
    - 'slp_dg_sav'
    - 'ele_mt_sav'
    - 'ele_mt_smn'
    - 'ele_mt_smx'
    - 'frac_snow'
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True    
  max_num_targets: -1
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords : 
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head : 
    ens_size : 1
    num_layers : 1


