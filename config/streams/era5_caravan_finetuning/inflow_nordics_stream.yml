CaravanCamels:
  type : obs
  stream_id: 2
  #filenames : ['/e/data1/slmet/sk_data/caravan/inflow_br_obs.zarr','/e/data1/slmet/sk_data/caravan/inflow_usa_obs.zarr']
  #filenames : ['/e/scratch/e-aif-2026sc02-173/nordhagen1/ap17/output/netcdf.zarr']
