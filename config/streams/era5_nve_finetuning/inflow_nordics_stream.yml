CaravanCamels:
  type : obs
  stream_id: 2
  filenames : ['/e/data1/slmet/sk_data/inflow_nordics_obs.zarr']
  base_datetime : '2001-01-01T00:00:00'
  coords_channels : ['lat', 'lon']
  target:
    - 'obsvalue_discharge_0'
  geoinfo_channels:
    - 'eccentricity'
    - 'area_km2'
    - 'elev_min'
    - 'elev_max'
    - 'elev_mean'
    - 'elev_median'
    - 'elev_std'
    - 'slope_max'
    - 'slope_mean'
    - 'slope_median'
    - 'slope_std'
    - 'urban_areas_frac'
    - 'agriculture_frac'
    - 'forest_frac'
    - 'grassland_frac'
    - 'moors_and_heathland_frac'
    - 'woodland_shrubs_frac'
    - 'sand_frac'
    - 'bare_rocks_frac'
    - 'sparsely_vegetated_frac'
    - 'glacier_frac'
    - 'peat_bogs_and_marshes_frac'
    - 'water_bodies_frac'
    - 'p_mean'
    - 'pet_mean'
    - 'aridity'
    - 'frac_snow'
    - 'moisture_index'
    - 'seasonality'
    - 'high_prec_freq'
    - 'high_prec_dur'
    - 'low_prec_freq'
    - 'low_prec_dur'
    - 'QA_internal'
    - 'QA_value'
    - 'Regulated'
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True    
  max_num_targets: -1
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  embed_target_coords : 
    net : linear
    dim_embed : 512
  target_readout :
    num_layers : 2
    num_heads : 4
  pred_head : 
    ens_size : 1
    num_layers : 1
